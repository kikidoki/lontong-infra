name: terraform-pr
on:
  pull_request:
    paths: ["**.tf", "**.tfvars", ".github/workflows/tf-*.yml"]
permissions: { id-token: write, contents: read }

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: pin actions to commit SHAs
      - uses: hashicorp/setup-terraform@v3
      - name: fmt (advisory until you have run `terraform fmt -recursive` once locally)
        run: terraform fmt -check -recursive -diff
        continue-on-error: true
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
        continue-on-error: true
      - name: checkov (advisory)
        uses: bridgecrewio/checkov-action@v12
        with: { directory: ., framework: terraform, soft_fail: true }

  plan:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix: { env: [staging, production] }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}   # read-only role, assumable from pull requests only
          aws-region: ap-southeast-1
      - working-directory: environments/${{ matrix.env }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"
          terraform validate
          terraform plan -input=false -lock=false -no-color | tee plan.txt
      - uses: actions/upload-artifact@v4
        with: { name: "plan-${{ matrix.env }}", path: "environments/${{ matrix.env }}/plan.txt" }
