name: terraform-apply-staging
on:
  push: { branches: [main], paths: ["modules/**", "environments/staging/**", ".github/workflows/tf-apply-staging.yml"] }
concurrency: { group: terraform-staging, cancel-in-progress: false }
permissions: { id-token: write, contents: read }
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging     # environment variable TF_APPLY_ROLE_ARN = lontong-tf-apply-staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.TF_APPLY_ROLE_ARN }}", aws-region: ap-southeast-1 }
      - working-directory: environments/staging
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"
          terraform apply -input=false -auto-approve
